<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, addDoc, onSnapshot, runTransaction, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGJfCcst93wFcYYEJWB5eIoUYyA5fEbAQ",
  authDomain: "sesh-3a9b9.firebaseapp.com",
  projectId: "sesh-3a9b9",
  storageBucket: "sesh-3a9b9.firebasestorage.app",
  messagingSenderId: "125296339015",
  appId: "1:125296339015:web:443f998390160649c2a962"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const XIRSYS_CONFIG = {
  path: "https://global.xirsys.net/_turn/channelf9b7de1c",
  ident: "locust4402",
  secret: "f98669d6-a3c6-11f1-bf12-0242ac150005"
};

let ICE_SERVERS = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

async function fetchXirsysIceServers() {
  try {
    const headers = new Headers();
    headers.append("Authorization", "Basic " + btoa(XIRSYS_CONFIG.ident + ":" + XIRSYS_CONFIG.secret));
    headers.append("Content-Type", "application/json");

    const response = await fetch(XIRSYS_CONFIG.path + "?webrtc=1", {
      method: "PUT",
      headers: headers
    });
    
    const data = await response.json();
    if (data.s === "ok" && data.v && data.v.iceServers) {
      ICE_SERVERS = { iceServers: data.v.iceServers };
      console.log("✅ Fetched fresh Xirsys ICE servers successfully");
    }
  } catch (err) {
    console.warn("⚠️ Fallback to default STUN due to Xirsys fetch error:", err);
  }
}

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const nextBtn = document.getElementById("nextBtn");
const stopBtn = document.getElementById("stopBtn");
const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
const messagesEl = document.getElementById("messages");

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = "status" + (cls ? " " + cls : "");
}

function addMessage(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setChatEnabled(enabled) {
  chatInput.disabled = !enabled;
  chatForm.querySelector("button").disabled = !enabled;
}

let myId = null;
let localStream = null;
let pc = null;
let roomId = null;
let unsubscribers = [];
let iceCandidateQueue = [];

function clearListeners() {
  unsubscribers.forEach((unsub) => {
    try { unsub(); } catch (e) {}
  });
  unsubscribers = [];
  iceCandidateQueue = [];
}

async function getLocalMedia() {
  if (localStream && localStream.active) return localStream;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: true
    });
    localVideo.srcObject = localStream;
    return localStream;
  } catch (err) {
    alert("Camera/Mic permission denied or unavailable. Check browser settings.");
    throw err;
  }
}

function createPeerConnection(onIceCandidate) {
  const connection = new RTCPeerConnection(ICE_SERVERS);
  
  if (localStream) {
    localStream.getTracks().forEach((track) => connection.addTrack(track, localStream));
  }

  const incomingStream = new MediaStream();
  remoteVideo.srcObject = incomingStream;

  connection.ontrack = (event) => {
    console.log("🎥 Received remote track:", event.track.kind);
    event.streams[0].getTracks().forEach((track) => {
      if (!incomingStream.getTracks().includes(track)) {
        incomingStream.addTrack(track);
      }
    });
    remoteVideo.play().catch((e) => console.log("Autoplay suppressed:", e));
  };

  connection.onicecandidate = (event) => {
    if (event.candidate) onIceCandidate(event.candidate.toJSON());
  };

  connection.onconnectionstatechange = () => {
    console.log("🔗 WebRTC Connection State:", connection.connectionState);
    if (connection.connectionState === "disconnected" || connection.connectionState === "failed" || connection.connectionState === "closed") {
      handlePartnerDisconnect();
    }
  };

  return connection;
}

async function drainCandidateQueue() {
  if (!pc || !pc.remoteDescription) return;
  while (iceCandidateQueue.length > 0) {
    const candidate = iceCandidateQueue.shift();
    try {
      await pc.addIceCandidate(new RTCIceCandidate(candidate));
    } catch (e) {}
  }
}

async function handlePartnerDisconnect() {
  if (!roomId) return;
  addMessage("Partner left the session.", "system");
  await teardownRoom();
  setChatEnabled(false);
  nextBtn.disabled = true;
  setStatus("Partner disconnected", "waiting");
  
  // Automatically search for a new partner after 2 seconds
  setTimeout(async () => {
    if (!roomId && startBtn.disabled) {
      await findPartner();
    }
  }, 2000);
}

async function findPartner() {
  clearListeners();
  setStatus("Looking for partner...", "waiting");
  addMessage("Scanning rotation for a partner...", "system");

  const waitingRef = collection(db, "waitingPool");
  const q = query(waitingRef, orderBy("createdAt"), limit(10));
  const snapshot = await getDocs(q);

  for (const candidate of snapshot.docs) {
    if (candidate.id === myId) continue;
    const claimed = await tryClaim(candidate.id);
    if (claimed) {
      roomId = claimed.roomId;
      await startAsCaller();
      return;
    }
  }

  await setDoc(doc(db, "waitingPool", myId), { createdAt: serverTimestamp() });
  listenForAssignment();
}

async function tryClaim(partnerId) {
  try {
    return await runTransaction(db, async (tx) => {
      const partnerRef = doc(db, "waitingPool", partnerId);
      const partnerSnap = await tx.get(partnerRef);
      if (!partnerSnap.exists()) return null;
      tx.delete(partnerRef);

      const roomRef = doc(collection(db, "rooms"));
      tx.set(roomRef, { callerId: myId, calleeId: partnerId, createdAt: serverTimestamp() });
      tx.set(doc(db, "assignments", partnerId), { roomId: roomRef.id });
      return { roomId: roomRef.id };
    });
  } catch (err) {
    return null;
  }
}

function listenForAssignment() {
  const assignRef = doc(db, "assignments", myId);
  const unsub = onSnapshot(assignRef, async (snap) => {
    if (!snap.exists()) return;
    const { roomId: assignedRoomId } = snap.data();
    unsub();
    await deleteDoc(assignRef).catch(() => {});
    await deleteDoc(doc(db, "waitingPool", myId)).catch(() => {});
    roomId = assignedRoomId;
    await startAsCallee();
  });
  unsubscribers.push(unsub);
}

async function startAsCaller() {
  setStatus("Connected", "connected");
  addMessage("Connected! Pass the vibes 🍃", "system");
  setChatEnabled(true);
  nextBtn.disabled = false;

  const roomRef = doc(db, "rooms", roomId);
  const callerCandidatesRef = collection(roomRef, "callerCandidates");
  const calleeCandidatesRef = collection(roomRef, "calleeCandidates");

  pc = createPeerConnection((candidate) => addDoc(callerCandidatesRef, candidate));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(roomRef, { offer: { sdp: offer.sdp, type: offer.type } }, { merge: true });

  let answerApplied = false;
  const unsubRoom = onSnapshot(roomRef, async (snap) => {
    if (!snap.exists()) {
      handlePartnerDisconnect();
      return;
    }
    const data = snap.data();
    if (data?.answer && !answerApplied && pc) {
      answerApplied = true;
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      await drainCandidateQueue();
    }
  });

  const unsubCandidates = onSnapshot(calleeCandidatesRef, (snap) => {
    snap.docChanges().forEach(async (change) => {
      if (change.type === "added" && pc) {
        const candidate = change.doc.data();
        if (pc.remoteDescription) {
          try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
        } else {
          iceCandidateQueue.push(candidate);
        }
      }
    });
  });

  unsubscribers.push(unsubRoom, unsubCandidates);
  listenForMessages(roomRef);
}

async function startAsCallee() {
  setStatus("Connected", "connected");
  addMessage("Connected! Pass the vibes 🍃", "system");
  setChatEnabled(true);
  nextBtn.disabled = false;

  const roomRef = doc(db, "rooms", roomId);
  const callerCandidatesRef = collection(roomRef, "callerCandidates");
  const calleeCandidatesRef = collection(roomRef, "calleeCandidates");

  pc = createPeerConnection((candidate) => addDoc(calleeCandidatesRef, candidate));

  let offerApplied = false;
  const unsubRoom = onSnapshot(roomRef, async (snap) => {
    if (!snap.exists()) {
      handlePartnerDisconnect();
      return;
    }
    const data = snap.data();
    if (data?.offer && !offerApplied && pc) {
      offerApplied = true;
      await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
      await drainCandidateQueue();
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await setDoc(roomRef, { answer: { sdp: answer.sdp, type: answer.type } }, { merge: true });
    }
  });

  const unsubCandidates = onSnapshot(callerCandidatesRef, (snap) => {
    snap.docChanges().forEach(async (change) => {
      if (change.type === "added" && pc) {
        const candidate = change.doc.data();
        if (pc.remoteDescription) {
          try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
        } else {
          iceCandidateQueue.push(candidate);
        }
      }
    });
  });

  unsubscribers.push(unsubRoom, unsubCandidates);
  listenForMessages(roomRef);
}

function listenForMessages(roomRef) {
  const messagesRef = collection(roomRef, "messages");
  const q = query(messagesRef, orderBy("createdAt"));
  const unsub = onSnapshot(q, (snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === "added") {
        const msg = change.doc.data();
        if (msg.senderId !== myId) {
          addMessage(msg.text, "stranger");
        }
      }
    });
  });
  unsubscribers.push(unsub);
}

async function sendMessage(text) {
  if (!roomId) return;
  const messagesRef = collection(doc(db, "rooms", roomId), "messages");
  await addDoc(messagesRef, { senderId: myId, text, createdAt: serverTimestamp() });
}

async function teardownRoom() {
  clearListeners();
  if (remoteVideo.srcObject) {
    remoteVideo.srcObject.getTracks().forEach((track) => track.stop());
    remoteVideo.srcObject = null;
  }
  if (pc) { 
    pc.close(); 
    pc = null; 
  }
  if (roomId) {
    const roomRef = doc(db, "rooms", roomId);
    await deleteDoc(roomRef).catch(() => {});
  }
  roomId = null;
}

async function leaveQueueIfWaiting() {
  clearListeners();
  if (myId) {
    await deleteDoc(doc(db, "waitingPool", myId)).catch(() => {});
    await deleteDoc(doc(db, "assignments", myId)).catch(() => {});
  }
}

startBtn.addEventListener("click", async () => {
  try {
    await getLocalMedia();
    await fetchXirsysIceServers();
  } catch (err) {
    return;
  }
  startBtn.disabled = true;
  stopBtn.disabled = false;
  messagesEl.innerHTML = "";
  await findPartner();
});

nextBtn.addEventListener("click", async () => {
  addMessage("Finding a new match...", "system");
  setChatEnabled(false);
  nextBtn.disabled = true;
  await teardownRoom();
  await fetchXirsysIceServers();
  await findPartner();
});

stopBtn.addEventListener("click", async () => {
  await teardownRoom();
  await leaveQueueIfWaiting();
  if (localStream) {
    localStream.getTracks().forEach((t) => t.stop());
    localStream = null;
    localVideo.srcObject = null;
  }
  startBtn.disabled = false;
  nextBtn.disabled = true;
  stopBtn.disabled = true;
  setChatEnabled(false);
  setStatus("Ready");
  addMessage("Sesh ended.", "system");
});

chatForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;
  addMessage(text, "me");
  chatInput.value = "";
  await sendMessage(text);
});

signInAnonymously(auth).catch((err) => {
  setStatus("Auth Error");
  console.error(err);
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    myId = user.uid;
    setStatus("Ready");
    startBtn.disabled = false;
  }
});
  </script>
