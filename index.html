<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🍃 Sesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #081008;
  --panel: #0f1c10;
  --border: #234a24;
  --accent: #4ad84a;
  --accent-dim: #1f6b23;
  --accent-bright: #7dff5a;
  --text: #e7f5e6;
  --text-dim: #7fa77e;
  --danger: #ff6b4a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at top, #10240f 0%, var(--bg) 70%);
  color: var(--text);
  font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

body {
  position: relative;
  display: flex;
  flex-direction: column;
}

.leaf-field {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.leaf-field::before,
.leaf-field::after {
  content: "🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿";
  position: absolute;
  left: -10%;
  width: 120%;
  font-size: 22px;
  line-height: 90px;
  letter-spacing: 40px;
  opacity: 0.06;
  white-space: pre-wrap;
  color: var(--accent-bright);
}

.leaf-field::before { top: 6%; transform: rotate(-6deg); }
.leaf-field::after { top: 55%; transform: rotate(4deg); }

.topbar, .layout, .controls { position: relative; z-index: 1; }

.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.topbar h1 {
  font-family: "Bungee", "Rubik", sans-serif;
  font-size: 18px;
  margin: 0;
  letter-spacing: 0.5px;
  color: var(--accent-bright);
  text-shadow: 0 0 18px rgba(125, 255, 90, 0.35);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.tagline {
  font-family: "Rubik", sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-dim);
  text-shadow: none;
}

.online-badge {
  font-size: 12px;
  background: rgba(31, 107, 35, 0.3);
  border: 1px solid var(--accent-dim);
  color: var(--accent-bright);
  padding: 4px 10px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}

.online-badge::before {
  content: "";
  width: 7px;
  height: 7px;
  background: var(--accent-bright);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-bright);
  display: inline-block;
}

.status {
  font-size: 12px;
  color: var(--text-dim);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  max-width: 140px;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

.status.connected { color: var(--accent-bright); border-color: var(--accent-dim); }
.status.waiting { color: #f2c94c; border-color: #6b5a1d; }

.layout {
  flex: 1;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  padding: 12px;
  min-height: 0;
  height: 100%;
}

.video-area {
  position: relative;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  min-height: 200px;
}

.video-wrap {
  width: 100%;
  height: 100%;
  position: relative;
}

.video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: #000;
}

.video-wrap.small {
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 110px;
  height: 140px;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 2;
}

.video-label {
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(0,0,0,0.55);
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-dim);
  z-index: 3;
}

.chat-area {
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  min-height: 0;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.msg {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  word-wrap: break-word;
}

.msg.me {
  align-self: flex-end;
  background: var(--accent-dim);
  color: white;
}

.msg.stranger {
  align-self: flex-start;
  background: #23262f;
}

.msg.admin {
  align-self: flex-start;
  background: #1f6b23;
  color: var(--accent-bright);
  border: 1px solid var(--accent);
}

.msg.system {
  align-self: center;
  color: var(--text-dim);
  font-style: italic;
  font-size: 12px;
  background: none;
  text-align: center;
}

.typing-indicator {
  height: 14px;
  padding: 0 10px;
  font-size: 11px;
  color: var(--text-dim);
}

.chat-form {
  display: flex;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.chat-form input {
  flex: 1;
  border: none;
  background: #10121a;
  color: var(--text);
  padding: 12px;
  font-size: 14px;
  outline: none;
}

.chat-form button {
  border: none;
  background: var(--accent);
  color: white;
  padding: 0 16px;
  cursor: pointer;
  font-weight: 600;
}

.chat-form button:disabled,
.chat-form input:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.controls {
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}

.controls button {
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #1d212b;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  flex: 1;
  max-width: 120px;
}

#startBtn { background: var(--accent); border-color: var(--accent); color: white; font-weight: bold; }
#stopBtn:not(:disabled) { border-color: var(--danger); color: var(--danger); }

@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: 1.2fr 1fr; }
  .video-wrap.small { width: 90px; height: 110px; }
}
</style>
</head>
<body>
  <div class="leaf-field" aria-hidden="true"></div>

  <div id="signInGate" style="position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; padding:24px;">
    <h1 style="margin:0;">🍃 Sesh <span style="color:var(--text-dim); font-weight:400; font-size:0.5em;">pull up with a stranger</span></h1>
    <p style="color:var(--text-dim); max-width:340px; margin:0;">Sign in with Google to jump into rotation.</p>
    <button id="googleSignInBtn" style="display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); color:var(--text); padding:12px 22px; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16 3 9 7.6 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.2-2 13.8-5.4l-6.4-5.4C29.3 35.5 26.8 36 24 36c-5.4 0-9.9-3.1-11.3-8.1l-6.6 5.1C9 40.4 16 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 3.5-3 6.3-5.9 8.1l6.4 5.4C39.8 38.3 43 32.5 43 24c0-1.4-.1-2.7-.4-4.5z"/></svg>
      Sign in with Google
    </button>
    <span id="signInError" style="color:var(--danger); font-size:13px; min-height:16px;"></span>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <h1>🍃 Sesh <span class="tagline">pull up with a stranger</span></h1>
      <div id="onlineBadge" class="online-badge">-- online</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span id="userEmailBadge" style="display:none; font-size:12px; color:var(--text-dim); background:var(--panel); border:1px solid var(--border); padding:4px 10px; border-radius:20px;"></span>
      <span id="status" class="status">Connecting...</span>
    </div>
  </header>

  <main class="layout">
    <section class="video-area">
      <div class="video-wrap">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="video-label">Partner</span>
      </div>
      <div class="video-wrap small">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="video-label">You</span>
      </div>
    </section>

    <section class="chat-area">
      <div id="messages" class="messages">
        <div class="msg system">Hit 'Spark' to jump into rotation.</div>
      </div>
      <div id="typingIndicator" class="typing-indicator"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" placeholder="Say what's good..." autocomplete="off" disabled />
        <button type="submit" disabled>Send</button>
      </form>
    </section>
  </main>

  <footer class="controls">
    <button id="startBtn" disabled>🔥 Spark</button>
    <button id="nextBtn" disabled>🔄 Pass</button>
    <button id="stopBtn" disabled>🚫 Ash</button>
  </footer>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, addDoc, onSnapshot, runTransaction, query, orderBy, limit, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", () => {
  const firebaseConfig = {
    apiKey: "AIzaSyCGJfCcst93wFcYYEJWB5eIoUYyA5fEbAQ",
    authDomain: "sesh-3a9b9.firebaseapp.com",
    projectId: "sesh-3a9b9",
    storageBucket: "sesh-3a9b9.firebasestorage.app",
    messagingSenderId: "125296339015",
    appId: "1:125296339015:web:443f998390160649c2a962"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const EXPRESSTURN_CONFIG = {
    username: "000000002103407246",
    credential: "l45ep7ID0KVe0gvS5JHg8yIqpus="
  };

  const ICE_SERVERS = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      {
        urls: "turn:free.expressturn.com:3478",
        username: EXPRESSTURN_CONFIG.username,
        credential: EXPRESSTURN_CONFIG.credential
      },
      {
        urls: "turn:free.expressturn.com:3478?transport=tcp",
        username: EXPRESSTURN_CONFIG.username,
        credential: EXPRESSTURN_CONFIG.credential
      }
    ]
  };

  // ExpressTurn's free tier uses static long-term credentials, so there's
  // nothing to fetch at runtime. Kept as a no-op so the existing call sites
  // (startBtn / nextBtn handlers below) don't need to change.
  async function fetchXirsysIceServers() {
    return Promise.resolve();
  }

  const localVideo = document.getElementById("localVideo");
  const remoteVideo = document.getElementById("remoteVideo");
  const statusEl = document.getElementById("status");
  const onlineBadge = document.getElementById("onlineBadge");
  const startBtn = document.getElementById("startBtn");
  const nextBtn = document.getElementById("nextBtn");
  const stopBtn = document.getElementById("stopBtn");
  const chatForm = document.getElementById("chatForm");
  const chatInput = document.getElementById("chatInput");
  const messagesEl = document.getElementById("messages");

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function addMessage(text, kind) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setChatEnabled(enabled) {
    chatInput.disabled = !enabled;
    chatForm.querySelector("button").disabled = !enabled;
  }

  let myId = null;
  let localStream = null;
  let pc = null;
  let roomId = null;
  let unsubscribers = [];
  let iceCandidateQueue = [];
  let heartbeatInterval = null;
  let snapshotInterval = null;

  function clearListeners() {
    unsubscribers.forEach((unsub) => {
      try { unsub(); } catch (e) {}
    });
    unsubscribers = [];
    iceCandidateQueue = [];
    if (snapshotInterval) {
      clearInterval(snapshotInterval);
      snapshotInterval = null;
    }
  }

  function startPresenceHeartbeat() {
    if (!myId) return;
    const userPresenceRef = doc(db, "presence", myId);

    const heartbeat = async () => {
      try {
        await setDoc(userPresenceRef, { lastSeen: Date.now() }, { merge: true });
      } catch (e) {}
    };

    heartbeat();
    heartbeatInterval = setInterval(heartbeat, 8000);

    const presenceCol = collection(db, "presence");
    const unsubPresence = onSnapshot(presenceCol, (snapshot) => {
      const now = Date.now();
      let count = 0;
      snapshot.forEach((d) => {
        const data = d.data();
        if (data.lastSeen) {
          if (now - data.lastSeen < 20000) {
            count++;
          }
        }
      });
      onlineBadge.textContent = `${Math.max(1, count)} online`;
    });
    unsubscribers.push(unsubPresence);

    window.addEventListener("beforeunload", () => {
      deleteDoc(userPresenceRef).catch(() => {});
    });
  }

  async function getLocalMedia() {
    if (localStream && localStream.active) return localStream;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true
      });
      localVideo.srcObject = localStream;
      return localStream;
    } catch (err) {
      alert("Camera/Mic permission denied or unavailable. Check browser settings.");
      throw err;
    }
  }

  function startSnapshotBroadcasting() {
    if (snapshotInterval) clearInterval(snapshotInterval);
    const canvas = document.createElement('canvas');
    canvas.width = 320;
    canvas.height = 240;
    const ctx = canvas.getContext('2d');

    snapshotInterval = setInterval(async () => {
      if (!roomId || !myId || !localVideo.readyState || localVideo.paused || localVideo.ended) return;
      
      try {
        ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

        const roomRef = doc(db, "rooms", roomId);
        await updateDoc(roomRef, {
          [`snapshots.${myId}`]: dataUrl
        });
      } catch (err) {
        // Suppress transient broadcast failures
      }
    }, 2000);
  }

  function createPeerConnection(onIceCandidate) {
    const connection = new RTCPeerConnection(ICE_SERVERS);
    
    if (localStream) {
      localStream.getTracks().forEach((track) => connection.addTrack(track, localStream));
    }

    const incomingStream = new MediaStream();
    remoteVideo.srcObject = incomingStream;

    connection.ontrack = (event) => {
      event.streams[0].getTracks().forEach((track) => {
        if (!incomingStream.getTracks().includes(track)) {
          incomingStream.addTrack(track);
        }
      });
      remoteVideo.play().catch((e) => {});
    };

    connection.onicecandidate = (event) => {
      if (event.candidate) onIceCandidate(event.candidate.toJSON());
    };

    let disconnectTimer = null;
    connection.onconnectionstatechange = () => {
      const state = connection.connectionState;
      
      if (state === "connected") {
        if (disconnectTimer) {
          clearTimeout(disconnectTimer);
          disconnectTimer = null;
        }
      } else if (state === "disconnected") {
        if (!disconnectTimer) {
          disconnectTimer = setTimeout(() => {
            if (connection.connectionState === "disconnected" || connection.connectionState === "failed") {
              handlePartnerDisconnect();
            }
          }, 5000);
        }
      } else if (state === "failed" || state === "closed") {
        if (disconnectTimer) clearTimeout(disconnectTimer);
        handlePartnerDisconnect();
      }
    };

    return connection;
  }

  async function drainCandidateQueue() {
    if (!pc || !pc.remoteDescription) return;
    while (iceCandidateQueue.length > 0) {
      const candidate = iceCandidateQueue.shift();
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) {}
    }
  }

  async function handlePartnerDisconnect() {
    if (!roomId) return;
    if (snapshotInterval) { clearInterval(snapshotInterval); snapshotInterval = null; }
    await teardownRoomLocally();
    addMessage("Partner ashed the session.", "system");
    setChatEnabled(false);
    nextBtn.disabled = true;
    stopBtn.disabled = true;
    startBtn.disabled = false;
    setStatus("Ready");
  }

  async function findPartner() {
    setStatus("Looking for partner...", "waiting");
    addMessage("Scanning rotation for a partner...", "system");

    const waitingRef = collection(db, "waitingPool");
    const q = query(waitingRef, orderBy("createdAt"), limit(10));
    const snapshot = await getDocs(q);

    for (const candidate of snapshot.docs) {
      if (candidate.id === myId) continue;
      const claimed = await tryClaim(candidate.id);
      if (claimed) {
        roomId = claimed.roomId;
        await startAsCaller();
        return;
      }
    }

    await setDoc(doc(db, "waitingPool", myId), { createdAt: serverTimestamp() });
    listenForAssignment();
  }

  async function tryClaim(partnerId) {
    try {
      return await runTransaction(db, async (tx) => {
        const partnerRef = doc(db, "waitingPool", partnerId);
        const partnerSnap = await tx.get(partnerRef);
        if (!partnerSnap.exists()) return null;
        tx.delete(partnerRef);

        const roomRef = doc(collection(db, "rooms"));
        tx.set(roomRef, { callerId: myId, calleeId: partnerId, createdAt: serverTimestamp() });
        tx.set(doc(db, "assignments", partnerId), { roomId: roomRef.id });
        return { roomId: roomRef.id };
      });
    } catch (err) {
      return null;
    }
  }

  function listenForAssignment() {
    const assignRef = doc(db, "assignments", myId);
    const unsub = onSnapshot(assignRef, async (snap) => {
      if (!snap.exists()) return;
      const { roomId: assignedRoomId } = snap.data();
      unsub();
      await deleteDoc(assignRef).catch(() => {});
      await deleteDoc(doc(db, "waitingPool", myId)).catch(() => {});
      roomId = assignedRoomId;
      await startAsCallee();
    });
    unsubscribers.push(unsub);
  }

  async function startAsCaller() {
    setStatus("Connected", "connected");
    addMessage("Connected! Pass the vibes 🍃", "system");
    setChatEnabled(true);
    nextBtn.disabled = false;
    startSnapshotBroadcasting();

    const roomRef = doc(db, "rooms", roomId);
    const callerCandidatesRef = collection(roomRef, "callerCandidates");
    const calleeCandidatesRef = collection(roomRef, "calleeCandidates");

    pc = createPeerConnection((candidate) => addDoc(callerCandidatesRef, candidate));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await setDoc(roomRef, { offer: { sdp: offer.sdp, type: offer.type } }, { merge: true });

    let answerApplied = false;
    const unsubRoom = onSnapshot(roomRef, async (snap) => {
      if (!snap.exists()) {
        handlePartnerDisconnect();
        return;
      }
      const data = snap.data();
      if (data?.status === "ashed") {
        handlePartnerDisconnect();
        return;
      }
      if (data?.answer && !answerApplied && pc) {
        answerApplied = true;
        await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        await drainCandidateQueue();
      }
    });

    const unsubCandidates = onSnapshot(calleeCandidatesRef, (snap) => {
      snap.docChanges().forEach(async (change) => {
        if (change.type === "added" && pc) {
          const candidate = change.doc.data();
          if (pc.remoteDescription) {
            try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
          } else {
            iceCandidateQueue.push(candidate);
          }
        }
      });
    });

    unsubscribers.push(unsubRoom, unsubCandidates);
    listenForMessages(roomRef);
  }

  async function startAsCallee() {
    setStatus("Connected", "connected");
    addMessage("Connected! Pass the vibes 🍃", "system");
    setChatEnabled(true);
    nextBtn.disabled = false;
    startSnapshotBroadcasting();

    const roomRef = doc(db, "rooms", roomId);
    const callerCandidatesRef = collection(roomRef, "callerCandidates");
    const calleeCandidatesRef = collection(roomRef, "calleeCandidates");

    pc = createPeerConnection((candidate) => addDoc(calleeCandidatesRef, candidate));

    let offerApplied = false;
    const unsubRoom = onSnapshot(roomRef, async (snap) => {
      if (!snap.exists()) {
        handlePartnerDisconnect();
        return;
      }
      const data = snap.data();
      if (data?.status === "ashed") {
        handlePartnerDisconnect();
        return;
      }
      if (data?.offer && !offerApplied && pc) {
        offerApplied = true;
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        await drainCandidateQueue();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await setDoc(roomRef, { answer: { sdp: answer.sdp, type: answer.type } }, { merge: true });
      }
    });

    const unsubCandidates = onSnapshot(callerCandidatesRef, (snap) => {
      snap.docChanges().forEach(async (change) => {
        if (change.type === "added" && pc) {
          const candidate = change.doc.data();
          if (pc.remoteDescription) {
            try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
          } else {
            iceCandidateQueue.push(candidate);
          }
        }
      });
    });

    unsubscribers.push(unsubRoom, unsubCandidates);
    listenForMessages(roomRef);
  }

  function listenForMessages(roomRef) {
    const messagesRef = collection(roomRef, "messages");
    const q = query(messagesRef, orderBy("createdAt"));
    const unsub = onSnapshot(q, (snap) => {
      snap.docChanges().forEach((change) => {
        if (change.type === "added") {
          const msg = change.doc.data();
          if (msg.senderId !== myId) {
            // Check if message came from Admin / Moderator
            if (msg.senderId === "Admin" || msg.senderId === "moderator") {
              addMessage(`Admin: ${msg.text}`, "admin");
            } else {
              addMessage(msg.text, "stranger");
            }
          }
        }
      });
    });
    unsubscribers.push(unsub);
  }

  async function sendMessage(text) {
    if (!roomId) return;
    const messagesRef = collection(doc(db, "rooms", roomId), "messages");
    await addDoc(messagesRef, { senderId: myId, text, createdAt: serverTimestamp() });
  }

  async function teardownRoomServerSide() {
    if (snapshotInterval) { clearInterval(snapshotInterval); snapshotInterval = null; }
    if (remoteVideo.srcObject) {
      remoteVideo.srcObject.getTracks().forEach((track) => track.stop());
      remoteVideo.srcObject = null;
    }
    if (pc) { 
      pc.close(); 
      pc = null; 
    }
    if (roomId) {
      const roomRef = doc(db, "rooms", roomId);
      await deleteDoc(roomRef).catch(() => {});
    }
    roomId = null;
  }

  async function teardownRoomLocally() {
    if (snapshotInterval) { clearInterval(snapshotInterval); snapshotInterval = null; }
    if (remoteVideo.srcObject) {
      remoteVideo.srcObject.getTracks().forEach((track) => track.stop());
      remoteVideo.srcObject = null;
    }
    if (pc) { 
      pc.close(); 
      pc = null; 
    }
    roomId = null;
  }

  async function leaveQueueIfWaiting() {
    if (myId) {
      await deleteDoc(doc(db, "waitingPool", myId)).catch(() => {});
      await deleteDoc(doc(db, "assignments", myId)).catch(() => {});
    }
  }

  startBtn.addEventListener("click", async () => {
    try {
      await getLocalMedia();
      await fetchXirsysIceServers();
    } catch (err) {
      return;
    }
    startBtn.disabled = true;
    stopBtn.disabled = false;
    messagesEl.innerHTML = "";
    await findPartner();
  });

  nextBtn.addEventListener("click", async () => {
    addMessage("Finding a new match...", "system");
    setChatEnabled(false);
    nextBtn.disabled = true;
    if (snapshotInterval) { clearInterval(snapshotInterval); snapshotInterval = null; }
    await teardownRoomServerSide();
    await fetchXirsysIceServers();
    await findPartner();
  });

  stopBtn.addEventListener("click", async () => {
    if (snapshotInterval) { clearInterval(snapshotInterval); snapshotInterval = null; }
    await teardownRoomServerSide();
    await leaveQueueIfWaiting();
    if (localStream) {
      localStream.getTracks().forEach((t) => t.stop());
      localStream = null;
      localVideo.srcObject = null;
    }
    startBtn.disabled = false;
    nextBtn.disabled = true;
    stopBtn.disabled = true;
    setChatEnabled(false);
    setStatus("Ready");
    addMessage("Sesh ended.", "system");
  });

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    addMessage(text, "me");
    chatInput.value = "";
    await sendMessage(text);
  });

  const googleProvider = new GoogleAuthProvider();
  const signInGate = document.getElementById("signInGate");
  const googleSignInBtn = document.getElementById("googleSignInBtn");
  const signInError = document.getElementById("signInError");

  googleSignInBtn.addEventListener("click", async () => {
    signInError.textContent = "";
    googleSignInBtn.disabled = true;
    try {
      await signInWithPopup(auth, googleProvider);
    } catch (err) {
      console.error(err);
      signInError.textContent = "Sign-in failed. Try again.";
    } finally {
      googleSignInBtn.disabled = false;
    }
  });

  const userEmailBadge = document.getElementById("userEmailBadge");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      myId = user.uid;
      signInGate.style.display = "none";
      setStatus("Ready");
      startBtn.disabled = false;
      startPresenceHeartbeat();
      if (user.email) {
        userEmailBadge.textContent = `Signed in as ${user.email}`;
        userEmailBadge.style.display = "inline-block";
      }
    } else {
      signInGate.style.display = "flex";
      userEmailBadge.style.display = "none";
    }
  });
});
  </script>
</body>
</html>
