<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🍃 Sesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #081008;
  --panel: #0f1c10;
  --border: #234a24;
  --accent: #4ad84a;
  --accent-dim: #1f6b23;
  --accent-bright: #7dff5a;
  --text: #e7f5e6;
  --text-dim: #7fa77e;
  --danger: #ff6b4a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at top, #10240f 0%, var(--bg) 70%);
  color: var(--text);
  font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

body {
  position: relative;
  display: flex;
  flex-direction: column;
}

.leaf-field {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.leaf-field::before,
.leaf-field::after {
  content: "🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿 🍃 🌿";
  position: absolute;
  left: -10%;
  width: 120%;
  font-size: 22px;
  line-height: 90px;
  letter-spacing: 40px;
  opacity: 0.06;
  white-space: pre-wrap;
  color: var(--accent-bright);
}

.leaf-field::before { top: 6%; transform: rotate(-6deg); }
.leaf-field::after { top: 55%; transform: rotate(4deg); }

.topbar, .layout, .controls { position: relative; z-index: 1; }

.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.topbar h1 {
  font-family: "Bungee", "Rubik", sans-serif;
  font-size: 18px;
  margin: 0;
  letter-spacing: 0.5px;
  color: var(--accent-bright);
  text-shadow: 0 0 18px rgba(125, 255, 90, 0.35);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.tagline {
  font-family: "Rubik", sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-dim);
  text-shadow: none;
}

.status {
  font-size: 12px;
  color: var(--text-dim);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  max-width: 140px;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

.status.connected { color: var(--accent-bright); border-color: var(--accent-dim); }
.status.waiting { color: #f2c94c; border-color: #6b5a1d; }

.layout {
  flex: 1;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  padding: 12px;
  min-height: 0;
  height: 100%;
}

.video-area {
  position: relative;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  min-height: 200px;
}

.video-wrap {
  width: 100%;
  height: 100%;
  position: relative;
}

.video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: #000;
}

.video-wrap.small {
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 110px;
  height: 140px;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 2;
}

.video-label {
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(0,0,0,0.55);
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-dim);
  z-index: 3;
}

.chat-area {
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  min-height: 0;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.msg {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  word-wrap: break-word;
}

.msg.me {
  align-self: flex-end;
  background: var(--accent-dim);
  color: white;
}

.msg.stranger {
  align-self: flex-start;
  background: #23262f;
}

.msg.system {
